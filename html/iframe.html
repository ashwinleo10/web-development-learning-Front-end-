<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe tag</title>
</head>
<body>
    <h1>Iframe tag</h1>
    <p>This is an iframe.</p>

    <iframe src="https://www.kodnest.com" 
    width="400" height="200" 
    scrolling="no" 
    frameborder="0"></iframe>


    <iframe srcdoc="<h1>My website</h1> <a href='https://www.kodnest.com' target='frame2'>Visit Kodnest</a>"
    name="frame1" 
    width="400" height="200" 
    scrolling="yes" 
    frameborder="1"></iframe>

    <iframe src="" 
    name="frame2"
    width="400" height="200" 
    scrolling="yes" 
    frameborder="0"></iframe>

</body>
</html>
