<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>box</title>
    <style>
        .box {
            width: 200px;
            height: 100px;
            background-color: lightblue;
            border: 10px solid black;
            padding: 10px;
            margin: 20px;
            /*1 value - 20px to all sides*/
            /*2 value - 20px 10px (top and bottom, left and right)*/
            /*3 value - 20px 10px 5px (top, left and right, bottom)*/
            /*4 value - 20px 10px 5px 15px (top, right, bottom, left)*/

            outline: 10px dashed red;
            box-shadow: 40px 20px 20px red;
        }   
    </style>
</head>
<body>
    <div class="box">
        <p>This is a box.</p>
    </div>
</body>
</html>
