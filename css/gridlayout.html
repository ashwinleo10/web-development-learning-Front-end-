<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>girdlayout</title>
    <style>
        .grid-container{
            display: grid;
            grid-template-columns: auto auto auto;
            gap: 5px;
            background-color: gray;
            padding: 5px;
        }
        .grid-container > div{
            background-color: #f1f1f1;
            text-align: center;
            padding: 10px ;
            font-size: 30px;
        }

        .item1{
            grid-column-start: 1;
            grid-column-end: 4;
            margin-bottom: 1px;
        }

        .item2{
            grid-row-start: 2;
            grid-row-end: 4;
        }

        .item3{
            grid-row-start: 2;
            grid-row-end: 4;
        }
        .item6{
            grid-column-start: 1;
            grid-column-end: 4;
        }
    </style>
</head>
<body>
    <h1>girdlayout - column & row</h1>

    <div class="grid-container">
        <div class="item1">
            <text-align: left>Header/Company logo
        </div>
        <div class="item2">
            Navigation
        </div>
        <div class="item3">
            Main Content
        </div>
        <div class="item4">
            Sidebar
        </div>
        <div class="item5">
            Contact Info
        </div>
        <div class="item6">
            Footer
        </div>

    </div>

</body>
</html>
