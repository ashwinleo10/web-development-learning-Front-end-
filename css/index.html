<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style</title>

    <!--2/3 External css -->
    <link rel="stylesheet" href="index.css">


    <!--2/3 Internal css -->
    <style>
        h2 {
            color: green;
            text-align: center;
        }
    </style>

</head>
<body>
    <!--1 Inline css -->
    <h1 style="color: blue; text-align: center;">This is an inline styled heading</h1>
    <h2>This is an internal styled heading</h2>

    <p>This is a paragraph styled by external css.</p>

</body>
</html>
